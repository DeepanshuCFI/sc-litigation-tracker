name: Weekly refresh

on:
  schedule:
    - cron: "40 2 * * 2"   # Tuesdays 02:40 UTC = 08:10 IST
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # failure notifications are filed as issues

concurrency:
  group: weekly-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IK_API_TOKEN: ${{ secrets.IK_API_TOKEN }}
      # Curation runs on Deepanshu's Claude subscription (`claude setup-token`,
      # valid one year), not the metered API. No ANTHROPIC_API_KEY here on purpose:
      # with no key in the env there is nothing for a failure to fall back to and bill.
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install certifi

      - name: Install Claude Code CLI (subscription inference backend)
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch new orders from Indian Kanoon
        run: python3 pipeline/refresh.py

      - name: LLM curation (classify candidates, write gists)
        run: python3 pipeline/auto_curate.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ docs/ pipeline/curation.json pipeline/directions.json
          if git diff --cached --quiet; then
            echo "No changes this week."
          else
            git commit -m "Weekly refresh $(date -u +%F)"
            git push
          fi

      # Runs after the commit so a dead token or an exhausted subscription limit
      # never costs the week's Indian Kanoon data, but still turns the run red
      # and files the failure issue below.
      - name: Fail if LLM curation could not run
        run: |
          python3 - <<'EOF'
          import datetime, json, pathlib, sys
          p = pathlib.Path("data/curation_log.json")
          log = json.loads(p.read_text()) if p.exists() else {}
          # the log is committed; only this run's log counts, not last week's
          if log.get("date") == datetime.date.today().isoformat() and log.get("llm_unavailable"):
              sys.exit("LLM curation did not run: " + log["llm_unavailable"]
                       + "\nNew orders are published with links but no gists; re-run once fixed.")
          print("curation ok (or nothing to curate)")
          EOF

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Weekly refresh FAILED — $(date -u +%F)"
          BODY="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          The Tuesday refresh did not complete; the dashboard is serving last week's data. Check the run log, then re-run via workflow_dispatch once fixed."
          # reuse a single open failure issue rather than piling up one per week
          EXISTING=$(gh issue list --state open --search "Weekly refresh FAILED in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$TITLE — $BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Job summary
        if: always()
        run: |
          echo "## Weekly refresh" >> "$GITHUB_STEP_SUMMARY"
          if [ -f data/refresh_report.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/refresh_report.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f data/curation_log.json ]; then
            echo '### Curation' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/curation_log.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
